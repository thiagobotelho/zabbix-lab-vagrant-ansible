---
# Os módulos fazem quoting e evitam SQL com senha interpolada em shell.
- name: Garantir usuário proprietário do banco Zabbix
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ zabbix_db_user }}"
    password: "{{ zabbix_db_password }}"
    role_attr_flags: LOGIN,NOCREATEDB
    state: present
  no_log: true

- name: Garantir banco Zabbix sem recriar banco existente
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ zabbix_db_name }}"
    owner: "{{ zabbix_db_user }}"
    encoding: UTF8
    lc_collate: "{{ zabbix_db_collation | default('en_US.UTF-8') }}"
    lc_ctype: "{{ zabbix_db_ctype | default('en_US.UTF-8') }}"
    template: template0
    state: present

- name: Garantir usuário de monitoramento
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ zabbix_monitor_user }}"
    password: "{{ zabbix_monitor_password }}"
    role_attr_flags: LOGIN,NOCREATEDB
    state: present
  no_log: true

- name: Conceder apenas papel de monitoramento PostgreSQL
  become_user: postgres
  community.postgresql.postgresql_membership:
    groups: pg_monitor
    target_roles: "{{ zabbix_monitor_user }}"
    state: present

- name: Conferir inicialização anterior e tabelas existentes
  become_user: postgres
  community.postgresql.postgresql_query:
    login_db: "{{ zabbix_db_name }}"
    query: >-
      SELECT to_regclass('public.dbversion') IS NOT NULL AS initialized,
      EXISTS (SELECT 1 FROM information_schema.tables
      WHERE table_schema = 'public') AS has_tables
  register: zabbix_schema_state
  changed_when: false

- name: Bloquear importação sobre banco parcialmente inicializado
  ansible.builtin.assert:
    that:
      - zabbix_schema_state.query_result[0].initialized or not zabbix_schema_state.query_result[0].has_tables
    fail_msg: Banco contém tabelas sem dbversion; recuperar ou migrar manualmente antes de prosseguir.

- name: Importar schema somente na primeira inicialização
  community.postgresql.postgresql_db:
    name: "{{ zabbix_db_name }}"
    login_user: "{{ zabbix_db_user }}"
    login_password: "{{ zabbix_db_password }}"
    login_host: 127.0.0.1
    state: restore
    target: /usr/share/zabbix-sql-scripts/postgresql/server.sql.gz
  when: not zabbix_schema_state.query_result[0].initialized
  no_log: true

- name: Garantir extensão TimescaleDB antes da conversão do schema
  become_user: postgres
  community.postgresql.postgresql_ext:
    name: timescaledb
    login_db: "{{ zabbix_db_name }}"
    state: present

- name: Conferir conversão anterior para hypertables
  become_user: postgres
  community.postgresql.postgresql_query:
    login_db: "{{ zabbix_db_name }}"
    query: >-
      SELECT EXISTS (SELECT 1 FROM timescaledb_information.hypertables
      WHERE hypertable_schema = 'public' AND hypertable_name = 'history') AS converted
  register: zabbix_timescale_state
  changed_when: false

- name: Converter schema para TimescaleDB somente uma vez
  community.postgresql.postgresql_script:
    login_db: "{{ zabbix_db_name }}"
    login_user: "{{ zabbix_db_user }}"
    login_password: "{{ zabbix_db_password }}"
    login_host: 127.0.0.1
    path: /usr/share/zabbix-sql-scripts/postgresql/timescaledb/schema.sql
  when: not zabbix_timescale_state.query_result[0].converted
  no_log: true
