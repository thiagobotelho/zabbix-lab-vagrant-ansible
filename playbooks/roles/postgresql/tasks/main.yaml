---
- name: Instalar dependências básicas
  apt:
    name:
      - wget
      - gnupg
      - lsb-release
      - python3-psycopg2
    state: present
    update_cache: yes

- name: Adicionar chave do PostgreSQL
  apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Adicionar repositório do PostgreSQL
  apt_repository:
    repo: "deb http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present

- name: Instalar PostgreSQL
  apt:
    name: "postgresql-16"
    state: present
    update_cache: yes

# Remover a regra ampla de versões anteriores antes de adicionar origens exatas.
- name: Remover regra legada de acesso amplo ao PostgreSQL
  ansible.builtin.lineinfile:
    path: /etc/postgresql/16/main/pg_hba.conf
    regexp: '^host\s+{{ zabbix_db_name | regex_escape }}\s+{{ zabbix_db_user | regex_escape }}\s+0\.0\.0\.0/0\s+md5$'
    state: absent
  notify: Restart PostgreSQL

- name: Remover regra legada ampla do usuário de monitoramento
  ansible.builtin.lineinfile:
    path: /etc/postgresql/16/main/pg_hba.conf
    regexp: '^host\s+all\s+{{ zabbix_monitor_user | regex_escape }}\s+0\.0\.0\.0/0\s+md5$'
    state: absent
  notify: Restart PostgreSQL

- name: Permitir somente hosts do inventário no banco Zabbix
  community.postgresql.postgresql_pg_hba:
    dest: /etc/postgresql/16/main/pg_hba.conf
    contype: host
    databases: "{{ zabbix_db_name }}"
    users: "{{ zabbix_db_user }}"
    source: "{{ hostvars[item].ansible_host }}/32"
    method: scram-sha-256
  loop: "{{ groups['zabbix_server'] + groups['zabbix_frontend'] }}"
  notify: Restart PostgreSQL

- name: Restringir conexão do usuário de monitoramento ao servidor Zabbix
  community.postgresql.postgresql_pg_hba:
    dest: /etc/postgresql/16/main/pg_hba.conf
    contype: host
    databases: all
    users: "{{ zabbix_monitor_user }}"
    source: "{{ hostvars[item].ansible_host }}/32"
    method: scram-sha-256
  loop: "{{ groups['zabbix_server'] }}"
  notify: Restart PostgreSQL

- name: Configurar postgresql.conf para aceitar conexões externas
  lineinfile:
    path: /etc/postgresql/16/main/postgresql.conf
    regexp: '^#?listen_addresses\s*='
    line: "listen_addresses = '*'"
    state: present

- name: Tunar PostgreSQL
  lineinfile:
    path: /etc/postgresql/16/main/postgresql.conf
    regexp: '^#?{{ item.param }}\s*='
    line: "{{ item.param }} = {{ item.value }}"
  with_items:
    - { param: 'max_connections', value: '100' }
    - { param: 'shared_buffers', value: '512MB' }
    - { param: 'work_mem', value: '8MB' }
    - { param: 'maintenance_work_mem', value: '128MB' }
    - { param: 'checkpoint_completion_target', value: '0.9' }
    - { param: 'wal_buffers', value: '16MB' }
  notify: Restart PostgreSQL

- name: Habilitar e iniciar o serviço do PostgreSQL
  service:
    name: postgresql
    state: started
    enabled: yes

- name: Adicionar repositório Zabbix e instalar pacote zabbix-sql-scripts e zabbix-agent2-plugin-postgresql
  block:
    - name: Baixar pacote do repositório Zabbix
      ansible.builtin.get_url:
        url: https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu24.04_all.deb
        dest: /tmp/zabbix-release.deb
        mode: '0644'

    - name: Instalar repositório Zabbix
      ansible.builtin.apt:
        deb: /tmp/zabbix-release.deb
        state: present

    - name: Atualizar cache do APT após adicionar repositório Zabbix
      ansible.builtin.apt:
        update_cache: yes

    - name: Instalar zabbix-sql-scripts
      ansible.builtin.apt:
        name: zabbix-sql-scripts
        state: present

    - name: Instalar zabbix-agent2-plugin-postgresql
      ansible.builtin.apt:
        name: zabbix-agent2-plugin-postgresql
        state: present
