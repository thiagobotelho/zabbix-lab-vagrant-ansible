name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: ruby -c Vagrantfile
      - run: pipx run yamllint==1.37.1 -d relaxed playbooks secret.example.yml
      - run: cp secret.example.yml secret.yml
      - run: pipx run --spec ansible-core==2.19.3 ansible-galaxy collection install -r requirements.yml
      - run: pipx run --spec ansible-core==2.19.3 ansible-playbook --syntax-check -i inventory.ini playbooks/zabbix_db_setup.yaml
